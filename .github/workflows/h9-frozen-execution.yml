name: H9 Frozen Execution

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h9-frozen-execution
  cancel-in-progress: false

jobs:
  h9:
    name: h9-frozen-execution
    if: github.event_name == 'workflow_dispatch'
    runs-on:
      - self-hosted
      - linux
      - h9-benchmark
    timeout-minutes: 1380

    steps:
      - name: Checkout frozen H9 commit
        uses: actions/checkout@v7
        with:
          ref: 316131032e383051731f8b229930817527056cc8
          clean: true
          persist-credentials: false

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: false
          cache: true

      - name: Verify frozen H9 checkout and dataset
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "316131032e383051731f8b229930817527056cc8"
          test -z "$(git status --short)"
          mkdir -p .h9-audit
          {
            echo "trigger_sha=${GITHUB_SHA}"
            echo "frozen_sha=$actual"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
          } | tee .h9-audit/preflight.txt

          test "$(sha256sum benchmarks/h9/manifest.json | awk '{print $1}')" = "3b062e0738b578d9a1c355555569a705cdeeb700bf7b6abcb2a9c2f8a14760bb"
          test "$(sha256sum benchmarks/h9/rubric.json | awk '{print $1}')" = "644d0ee576c4564b124c2303a9208c142e261b9ba6ef96d78ad706616c17b952"
          test "$(sha256sum benchmarks/h9/adapter-policy.json | awk '{print $1}')" = "3f20cb1ab9f160e140b6fb34fcdf9e3285dd9504f3def5df746ff047ea27fb6a"
          sha256sum benchmarks/h9/manifest.json benchmarks/h9/rubric.json benchmarks/h9/adapter-policy.json \
            | tee .h9-audit/dataset-root.sha256
          find benchmarks/h9/cases -type f -print0 | sort -z | xargs -0 sha256sum \
            | tee .h9-audit/replay-files.sha256

      - name: Verify ChatGPT-web-only current-session policy
        shell: bash
        run: |
          set -euo pipefail
          for key in OPENAI_API_KEY CODEX_API_KEY ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN GEMINI_API_KEY GOOGLE_API_KEY AZURE_OPENAI_API_KEY; do
            if [[ -n "${!key:-}" ]]; then
              echo "metered API credentials are forbidden for H9; unset $key" >&2
              exit 1
            fi
          done

          grep -Fq '"id":"human-chatgpt-session"' benchmarks/h9/adapter-policy.json
          ! grep -Eq 'claude-max|codex-chatgpt|antigravity-subscription' benchmarks/h9/adapter-policy.json
          grep -Fq 'UseCurrentSession: true' cmd/agentd/h9_benchmark.go
          grep -Fq 'RequireCurrentSession' internal/council/humanbroker/types.go
          grep -Fq 'Use the current orchestrating ChatGPT conversation; do not open a New Chat.' internal/council/humanbroker/runtime.go
          {
            echo 'provider_policy=chatgpt-web-only'
            echo 'adapter=human-chatgpt-session'
            echo 'session_mode=current-session'
            echo 'failover=forbidden'
            echo 'automatic_retry=forbidden'
          } | tee -a .h9-audit/preflight.txt
          go version | tee -a .h9-audit/preflight.txt

      - name: Verify H9 loader and repository tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/council/benchmark -run H9 -count=1 2>&1 | tee .h9-audit/h9-focused-test.txt
          go test ./cmd/agentd -run H9 -count=1 2>&1 | tee .h9-audit/h9-cli-test.txt
          go test ./... 2>&1 | tee .h9-audit/go-test.txt

      - name: Execute H9 exactly once
        shell: bash
        run: |
          set -uo pipefail
          set +e
          go run ./cmd/agentd council benchmark h9 \
            --dataset benchmarks/h9 \
            > >(tee .h9-audit/h9-output.json) \
            2> >(tee .h9-audit/h9-stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" | tee .h9-audit/exit-code.txt
          exit "$rc"

      - name: Collect H9 audit evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .h9-audit
          : > .h9-audit/key-artifacts.sha256
          : > .h9-audit/all-artifacts.sha256
          if [[ -d .council/runs ]]; then
            mapfile -t run_dirs < <(find .council/runs -mindepth 1 -maxdepth 1 -type d -print | sort)
            printf 'run_dir_count=%d\n' "${#run_dirs[@]}" | tee -a .h9-audit/audit.txt
            if [[ ${#run_dirs[@]} -eq 1 ]]; then
              run_dir="${run_dirs[0]}"
              printf 'run_dir=%s\n' "$run_dir" | tee -a .h9-audit/audit.txt
              printf 'run_id=%s\n' "$(basename "$run_dir")" | tee -a .h9-audit/audit.txt
              request_count="$(find "$run_dir/human-broker" -type f -name request.json 2>/dev/null | wc -l | tr -d ' ')"
              response_count="$(find "$run_dir/human-broker" -type f -name response.json 2>/dev/null | wc -l | tr -d ' ')"
              printf 'human_broker_request_count=%s\n' "$request_count" | tee -a .h9-audit/audit.txt
              printf 'human_broker_response_count=%s\n' "$response_count" | tee -a .h9-audit/audit.txt
              for rel in h9-run.json eval/batch-summary.json h9-result.json; do
                path="$run_dir/$rel"
                if [[ -f "$path" ]]; then
                  sha256sum "$path" | tee -a .h9-audit/key-artifacts.sha256
                fi
              done
            fi
            while IFS= read -r -d '' file; do
              sha256sum "$file" >> .h9-audit/all-artifacts.sha256
            done < <(find .council/runs -type f -print0 | sort -z)
          else
            echo 'run_dir_count=0' | tee -a .h9-audit/audit.txt
          fi
          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "workflow_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [[ -f .h9-audit/exit-code.txt ]]; then
              echo "benchmark_exit_code=$(cat .h9-audit/exit-code.txt)"
            else
              echo "benchmark_exit_code=not_started"
            fi
          } | tee -a .h9-audit/audit.txt

          cat .h9-audit/audit.txt >> "$GITHUB_STEP_SUMMARY"
          if [[ -s .h9-audit/key-artifacts.sha256 ]]; then
            {
              echo
              echo 'Key artifact SHA-256:'
              echo '```text'
              cat .h9-audit/key-artifacts.sha256
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full or partial H9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h9-frozen-${{ github.run_id }}
          path: |
            .h9-audit
            .council/runs
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
