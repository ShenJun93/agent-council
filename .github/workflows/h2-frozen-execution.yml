name: H2 Frozen Execution

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h2-frozen-execution
  cancel-in-progress: false

jobs:
  h2:
    name: h2-frozen-execution
    runs-on:
      - self-hosted
      - linux
      - h2-benchmark
    timeout-minutes: 1380

    steps:
      - name: Checkout frozen H2 commit
        uses: actions/checkout@v7
        with:
          ref: 96e3c056bc92bf32d52dc159cd743fe5f7d21d32
          clean: true
          persist-credentials: false
      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: false
          cache: true

      - name: Verify frozen checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "96e3c056bc92bf32d52dc159cd743fe5f7d21d32"
          status="$(git status --short)"
          test -z "$status"
          mkdir -p .h2-audit
          {
            echo "trigger_sha=${GITHUB_SHA}"
            echo "frozen_sha=$actual"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
          } | tee .h2-audit/preflight.txt
          sha256sum benchmarks/h2/manifest.json benchmarks/h2/rubric.json benchmarks/h2/cases.json \
            | tee .h2-audit/dataset.sha256
      - name: Verify subscription CLIs
        shell: bash
        run: |
          set -euo pipefail
          for key in OPENAI_API_KEY CODEX_API_KEY ANTHROPIC_API_KEY; do
            if [[ -n "${!key:-}" ]]; then
              echo "metered API credentials are forbidden for H2; unset $key" >&2
              exit 1
            fi
          done
          command -v claude | tee -a .h2-audit/preflight.txt
          claude --version | tee -a .h2-audit/preflight.txt
          claude_status="$(claude auth status 2>&1)"
          printf '%s\n' "$claude_status" | tee -a .h2-audit/preflight.txt
          grep -Eq '"loggedIn"[[:space:]]*:[[:space:]]*true' <<<"$claude_status"
          grep -Eq '"authMethod"[[:space:]]*:[[:space:]]*"claude\.ai"' <<<"$claude_status"
          grep -Eq '"apiProvider"[[:space:]]*:[[:space:]]*"firstParty"' <<<"$claude_status"
          grep -Eq '"subscriptionType"[[:space:]]*:[[:space:]]*"[^\"]+"' <<<"$claude_status"
          command -v codex | tee -a .h2-audit/preflight.txt
          codex --version | tee -a .h2-audit/preflight.txt
          codex_status="$(codex login status 2>&1)"
          printf '%s\n' "$codex_status" | tee -a .h2-audit/preflight.txt
          grep -Fq 'Logged in using ChatGPT' <<<"$codex_status"
          go version | tee -a .h2-audit/preflight.txt
      - name: Verify repository tests on frozen commit
        shell: bash
        run: |
          set -euo pipefail
          go test ./... 2>&1 | tee .h2-audit/go-test.txt

      - name: Execute H2 exactly once
        shell: bash
        run: |
          set -uo pipefail
          set +e
          go run ./cmd/agentd council benchmark h2 \
            --dataset benchmarks/h2 \
            > >(tee .h2-audit/h2-output.json) \
            2> >(tee .h2-audit/h2-stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" | tee .h2-audit/exit-code.txt
          exit "$rc"

      - name: Collect H2 audit evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .h2-audit
          : > .h2-audit/key-artifacts.sha256
          : > .h2-audit/all-artifacts.sha256
          if [[ -d .council/runs ]]; then
            mapfile -t run_dirs < <(find .council/runs -mindepth 1 -maxdepth 1 -type d -print | sort)
            printf 'run_dir_count=%d\n' "${#run_dirs[@]}" | tee -a .h2-audit/audit.txt
            if [[ ${#run_dirs[@]} -eq 1 ]]; then
              run_dir="${run_dirs[0]}"
              printf 'run_dir=%s\n' "$run_dir" | tee -a .h2-audit/audit.txt
              printf 'run_id=%s\n' "$(basename "$run_dir")" | tee -a .h2-audit/audit.txt
              for rel in h2-run.json eval/batch-summary.json h2-result.json; do
                path="$run_dir/$rel"
                if [[ -f "$path" ]]; then
                  sha256sum "$path" | tee -a .h2-audit/key-artifacts.sha256
                fi
              done
            fi
            while IFS= read -r -d '' file; do
              sha256sum "$file" >> .h2-audit/all-artifacts.sha256
            done < <(find .council/runs -type f -print0 | sort -z)
          else
            echo 'run_dir_count=0' | tee -a .h2-audit/audit.txt
          fi
          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "workflow_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [[ -f .h2-audit/exit-code.txt ]]; then
              echo "benchmark_exit_code=$(cat .h2-audit/exit-code.txt)"
            else
              echo "benchmark_exit_code=not_started"
            fi
          } | tee -a .h2-audit/audit.txt

          cat .h2-audit/audit.txt >> "$GITHUB_STEP_SUMMARY"
          if [[ -s .h2-audit/key-artifacts.sha256 ]]; then
            {
              echo
              echo 'Key artifact SHA-256:'
              echo '```text'
              cat .h2-audit/key-artifacts.sha256
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full or partial H2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-frozen-${{ github.run_id }}
          path: |
            .h2-audit
            .council/runs
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
